name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package AppImage GUI (.AppImage)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          fi

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/lib/udev/rules.d
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/RustCooling AppDir/usr/bin/RustCooling
          chmod 755 AppDir/usr/bin/RustCooling
          cp -P /usr/lib/x86_64-linux-gnu/libxdo.so* AppDir/usr/lib/ 2>/dev/null || true
          cp packaging/linux/99-idcooling.rules AppDir/usr/lib/udev/rules.d/
          cp packaging/linux/rustcooling.desktop AppDir/usr/share/applications/
          cp packaging/linux/rustcooling.desktop AppDir/rustcooling.desktop
          cp assets/icons/logo_256.png AppDir/usr/share/icons/hicolor/256x256/apps/rustcooling.png
          cp assets/icons/logo_256.png AppDir/rustcooling.png
          cp assets/icons/logo_256.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/RustCooling" "$@"
          EOF
          chmod 755 AppDir/AppRun

          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream AppDir "RustCooling-GUI-${VERSION}.AppImage"

      - name: Package AppImage TUI (.AppImage)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          fi

          mkdir -p AppDirTui/usr/bin
          mkdir -p AppDirTui/usr/lib/udev/rules.d
          mkdir -p AppDirTui/usr/share/applications
          mkdir -p AppDirTui/usr/share/icons/hicolor/256x256/apps

          cp target/release/rustcooling-cli AppDirTui/usr/bin/rustcooling-cli
          chmod 755 AppDirTui/usr/bin/rustcooling-cli
          cp packaging/linux/99-idcooling.rules AppDirTui/usr/lib/udev/rules.d/
          cp packaging/linux/rustcooling-tui.desktop AppDirTui/usr/share/applications/
          cp packaging/linux/rustcooling-tui.desktop AppDirTui/rustcooling-tui.desktop
          cp assets/icons/logo_256.png AppDirTui/usr/share/icons/hicolor/256x256/apps/rustcooling.png
          cp assets/icons/logo_256.png AppDirTui/rustcooling.png
          cp assets/icons/logo_256.png AppDirTui/.DirIcon

          cat << 'EOF' > AppDirTui/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/rustcooling-cli" "$@"
          EOF
          chmod 755 AppDirTui/AppRun

          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream AppDirTui "RustCooling-TUI-${VERSION}.AppImage"

      - name: Publish or Upload Linux Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
            TAG_NAME="v${VERSION}"
          fi
          ASSETS=(
            "RustCooling-GUI-${VERSION}.AppImage"
            "RustCooling-TUI-${VERSION}.AppImage"
          )
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ -f RELEASE_NOTES.md ]; then
              gh release create "$TAG_NAME" \
                "${ASSETS[@]}" \
                --title "RustCooling ${VERSION}" \
                --notes-file RELEASE_NOTES.md \
                --draft=false
            else
              gh release create "$TAG_NAME" \
                "${ASSETS[@]}" \
                --title "RustCooling ${VERSION}" \
                --generate-notes \
                --draft=false
            fi
          else
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            if [ -f RELEASE_NOTES.md ]; then
              gh release edit "$TAG_NAME" --notes-file RELEASE_NOTES.md --draft=false || true
            else
              gh release edit "$TAG_NAME" --draft=false || true
            fi
          fi

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows Release Binary
        run: cargo build --release --bin RustCooling

      - name: Upload Windows Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
            TAG_NAME="v${VERSION}"
          fi
          cp target/release/RustCooling.exe "RustCooling-${VERSION}.exe"
          gh release upload "$TAG_NAME" "RustCooling-${VERSION}.exe" --clobber
          gh release edit "$TAG_NAME" --draft=false || true