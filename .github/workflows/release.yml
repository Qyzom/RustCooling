name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Debian (.deb)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi
          echo "Packaging version: $VERSION"

          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/lib/udev/rules.d
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps

          cp target/release/RustCooling pkg/usr/bin/RustCooling
          chmod 755 pkg/usr/bin/RustCooling
          cp packaging/linux/99-idcooling.rules pkg/usr/lib/udev/rules.d/
          cp packaging/linux/rustcooling.desktop pkg/usr/share/applications/
          cp assets/icons/logo_256.png pkg/usr/share/icons/hicolor/256x256/apps/rustcooling.png

          cat << EOF > pkg/DEBIAN/control
          Package: rustcooling
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Qyzom <t0lotsmail@gmail.com>
          Depends: libudev1, libfontconfig1, libc6, libgtk-3-0, libxdo3
          Homepage: https://github.com/Qyzom/RustCooling
          Description: Ultra-lightweight LCD Display controller for ID-COOLING FX series liquid coolers
           Ultra-lightweight native Rust application for controlling LCD displays on
           ID-COOLING FX series liquid coolers (FX240, FX280, FX360).
           Zero telemetry bloat, <15 MB RAM, native hwmon support.
          EOF

          cat << 'EOF' > pkg/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
            udevadm trigger || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF
          chmod 755 pkg/DEBIAN/postinst

          dpkg-deb --build --root-owner-group pkg "RustCooling-${VERSION}.deb"

      - name: Package Tarball (.tar.gz)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi

          mkdir -p tarball
          cp target/release/RustCooling tarball/
          cp packaging/linux/99-idcooling.rules tarball/
          cp packaging/linux/rustcooling.desktop tarball/
          cp packaging/linux/install.sh tarball/
          cp packaging/linux/uninstall.sh tarball/
          cp assets/icons/logo_256.png tarball/logo.png
          tar -czvf "RustCooling-${VERSION}.tar.gz" -C tarball .

      - name: Package AppImage (.AppImage)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib/udev/rules.d
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/RustCooling AppDir/usr/bin/RustCooling
          chmod 755 AppDir/usr/bin/RustCooling
          cp packaging/linux/99-idcooling.rules AppDir/usr/lib/udev/rules.d/
          cp packaging/linux/rustcooling.desktop AppDir/usr/share/applications/
          cp packaging/linux/rustcooling.desktop AppDir/rustcooling.desktop
          cp assets/icons/logo_256.png AppDir/usr/share/icons/hicolor/256x256/apps/rustcooling.png
          cp assets/icons/logo_256.png AppDir/rustcooling.png
          cp assets/icons/logo_256.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/RustCooling" "$@"
          EOF
          chmod 755 AppDir/AppRun

          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "RustCooling-${VERSION}.AppImage"

      - name: Upload Linux Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
            TAG_NAME="v1.0.0"
          fi
          gh release upload "$TAG_NAME" "RustCooling-${VERSION}.AppImage" "RustCooling-${VERSION}.deb" "RustCooling-${VERSION}.tar.gz" --clobber || true